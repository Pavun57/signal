# Signal self-host.
#
# This compose file runs the Next.js app only. Bring your own Supabase —
# either a hosted project (https://supabase.com) or a local stack via
# `supabase start`.
#
# Minimal local setup (compose interpolates .env automatically):
#   cp .env.example .env
#   # fill in the Supabase + AI_API_KEY blocks at minimum
#   docker compose up -d
#
# Dokploy: choose Build Type "Docker Compose", set the compose path to this
# file, and paste the same keys into the Environment section — ${VAR}
# references below feed BOTH the build args (NEXT_PUBLIC_* are inlined into
# the client bundle at build time) and the container's runtime env.
#
# The app will be reachable at http://localhost:3000.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time env (inlined into the client bundle — cannot be
        # runtime-only, so they must be present when the image is built).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    image: signal:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Supabase (data + built-in email/password auth)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # AI provider (any OpenAI-compatible endpoint)
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.anthropic.com/v1}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      AI_INPUT_PRICE_PER_MTOK: ${AI_INPUT_PRICE_PER_MTOK:-3.0}
      AI_OUTPUT_PRICE_PER_MTOK: ${AI_OUTPUT_PRICE_PER_MTOK:-15.0}
      AI_STAGEHAND_MODEL: ${AI_STAGEHAND_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_ADMIN_KEY: ${ANTHROPIC_ADMIN_KEY:-}
      # Browserbase + Stagehand
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY:-}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID:-}
      # Email sending
      EMAIL_CREDENTIALS_KEY: ${EMAIL_CREDENTIALS_KEY:-}
      # Job scheduler
      CRON_SECRET: ${CRON_SECRET:-}
      # Data providers
      EXA_API_KEY: ${EXA_API_KEY:-}
      EXA_SERVICE_API_KEY: ${EXA_SERVICE_API_KEY:-}
      EXA_API_KEY_ID: ${EXA_API_KEY_ID:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      # Reacher email verifier (EMAIL_PROVIDER=reacher). Defaults to the
      # in-network service below; set REACHER_API_URL to use an external one.
      REACHER_API_URL: ${REACHER_API_URL:-http://reacher:8080}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # PostHog (optional analytics)
      NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
      # Public URL (webhook callbacks)
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    healthcheck:
      # /api/health is unauthenticated by design — a fixed literal.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - reacher

  # Self-hosted email verification (Reacher's check-if-email-exists). Only
  # used when EMAIL_PROVIDER=reacher; the app talks to it over the internal
  # network at http://reacher:8080, so no port is published.
  #
  # NOTE: SMTP probing needs OUTBOUND port 25 open on the host. Some VPS
  # providers block it — then every verdict degrades to "unknown", which
  # Signal treats as retryable/unavailable (verification effectively off).
  reacher:
    image: reacherhq/backend:latest
    restart: unless-stopped
    environment:
      RUST_LOG: info
