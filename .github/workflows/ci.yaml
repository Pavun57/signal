name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  # The e2e suite is not wired up here yet. The remaining blocker is
  # credentials -- the suite needs a local Supabase (`supabase start`) with
  # its service-role key, and it refuses to run without them by design.
  #
  # To turn it on: `supabase start` in the job, then pass the local stack's
  # env into the test run, then uncomment. Do not point it at a production
  # project: the suite creates and deletes users.
  #
  # e2e:
  #   name: End-to-end
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
